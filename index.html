<!doctype html>
<html lang="en">

    <title>Generador de paletas</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="header">
      <img class="header__logo" src="img/logo.png" alt="" />
      <h1 class="header__titulo">Colorfly Studio</h1>
    </header>

    <main>
      <section class="main__section--generador">
        <div class="main__section--div1">
          <h2>Generador de paletas de colores</h2>
          <p>Crea paletas de colores profesionales en segundos.</p>
        </div>

        <div class="main__section--div2">
          <h3>Tamaño de la paleta</h3>

          <button class="div2__button" id="#6">6 colores</button>
          <button class="div2__button" id="#8">8 colores</button>
          <button class="div2__button" id="#9">9 colores</button>
        </div>

        <button class="main__section--button">Generar colores</button>
      </section>

      <section>
        <ul>
          <li>#f34352</li>
          <li>#f34352</li>
          <li>#f34352</li>
          <li>#f34352</li>
